<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#14171d">
  <title>Yukio · 记录详情</title>
  <link rel="stylesheet" href="/glance.css"><link rel="stylesheet" href="/style.css"><script src="/i18n.js" defer></script><script src="/explanation.js" defer></script><script src="/context.js" defer></script><script src="/app.js" defer></script>
</head>
<body class="records">
<a class="skip-link" href="#main">跳到主要内容</a>
<div class="shell">
<aside class="rail" aria-label="选择记录">
  <div class="rail-head">
    <div class="rail-title"><a class="rail-back" href="/"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>返回工作台</a></div>
    <div class="rail-fields">
      <label class="rail-field"><span>助手</span><select id="client" aria-label="选择客户端"></select></label>
      <label class="rail-field"><span>范围</span><select id="scope" aria-label="记录范围"><option value="0">当前观察版本</option><option value="1">旧观察版本</option></select></label>
    </div>
  </div>
  <div class="rail-list">
    <h2>会话记录 <span id="groupCount"></span></h2><p class="rail-empty">同一聊天的不同来源、助手和观察版本分别保留。</p>
    <div id="groups"></div>
    <button id="moreGroups" class="rail-more" type="button" hidden>查看更多会话</button>
  </div>
  <div class="rail-foot">
    <p id="recorderStatus" role="status"></p>
    <div class="rail-foot-row"><span id="connection" class="connection" role="status">正在读取本机历史…</span><small id="checked"></small></div>
    <p class="local">仅在这台电脑上</p>
  </div>
</aside>
<main id="main">
  <header class="chat-head">
    <div class="chat-head-top">
      <div class="chat-id"><h1 id="selection">从左侧选择一份记录</h1><p id="selectionNote">最新保存的记录在前。保存顺序不等于不同助手实际执行的先后。</p></div>
      <div class="head-actions"><span id="news" role="status"></span><button id="refresh" class="btn" type="button">刷新记录</button></div>
    </div>
  </header>
  <div class="views">
    <div class="record-body">
      <div id="error" role="alert" hidden></div>
      <p class="view-note"><strong>记录与说明</strong> 记录数量不代表任务完成度。默认显示本机规则说明；选择“让模型解释”后，先预览再发送。模型解释单独标注，不改变原始记录。</p>
      <p id="modelStatus" class="view-note">正在读取解释功能配置…</p>
      <p id="selectionLabel" class="sr-only">等待选择</p>
      <div id="notices"></div>
      <section aria-label="活动时间线">
        <div id="timeline"><p class="record-empty">你的历史仍保存在本机。选择一份记录后，具体活动会出现在这里。</p></div>
        <button id="moreEvents" class="btn" type="button" hidden>查看更早记录</button>
      </section>
      <p class="footnote">只读历史，解释需手动发送，模型解释不改写记录。工具报告成功、整项任务完成、你认可结果，是三件不同的事。</p>
    </div>
  </div>
</main>
</div>
</body></html>
