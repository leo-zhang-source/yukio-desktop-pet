name: Agent explanation portability

on:
  workflow_dispatch:
  push:
    branches: [codex/agent-portability]
  pull_request:
    paths: ['tools/activity-workbench/**', '.github/workflows/agent-portability.yml']

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Workbench and isolated agent scenarios
        run: python -m unittest discover -s tools/activity-workbench -p "test_*.py" -v
      - name: Browser behavior and languages
        run: node --test tools/activity-workbench/test_glance_ui.cjs tools/activity-workbench/test_language_ui.cjs
      - name: Install package builder
        if: runner.os != 'Linux'
        run: python -m pip install "pyinstaller>=6,<7"
      - name: Build native Windows workbench
        if: runner.os == 'Windows'
        run: python tools/activity-workbench/build_windows.py --out build/agent-windows
      - name: Check native Windows runtime with offline agent clients
        if: runner.os == 'Windows'
        run: python tools/activity-workbench/check_agent_runtime.py --runtime build/agent-windows/windows/YukioWorkbench/YukioWorkbench.exe --out build/agent-check
      - name: Build native Mac workbench
        if: runner.os == 'macOS'
        run: python tools/activity-workbench/build_macos.py --out build/agent-macos
      - name: Check native Mac runtime with offline agent clients
        if: runner.os == 'macOS'
        run: python tools/activity-workbench/check_agent_runtime.py --runtime "build/agent-macos/雪绪活动工作台.app/Contents/Resources/runtime/YukioRuntime/YukioRuntime" --out build/agent-check
      - uses: actions/upload-artifact@v4
        if: always() && runner.os != 'Linux'
        with:
          name: agent-explanation-${{ runner.os }}
          path: |
            build/agent-check/*.json
            build/agent-check/*.log
            build/agent-macos/*0.4.2.zip
      - name: Publish Windows package only when distribution is enabled
        if: runner.os == 'Windows' && vars.YUKIO_WINDOWS_DISTRIBUTION == 'enabled'
        uses: actions/upload-artifact@v4
        with:
          name: agent-explanation-Windows-package
          path: build/agent-windows/*.zip
